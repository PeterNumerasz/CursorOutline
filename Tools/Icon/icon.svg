<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#2a3150"/>
      <stop offset="0.6" stop-color="#141829"/>
      <stop offset="1" stop-color="#07080f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b3"/>
      <stop offset="0.35" stop-color="#f2c14e"/>
      <stop offset="0.7" stop-color="#b9821f"/>
      <stop offset="1" stop-color="#ffe08a"/>
    </linearGradient>
    <linearGradient id="cursorFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfd6e6"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="frame">
      <rect x="20" y="20" width="472" height="472" rx="72"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="20" y="20" width="472" height="472" rx="72" fill="url(#bg)"/>

  <g clip-path="url(#frame)">
    <!-- Target rings behind the cursor -->
    <g fill="none" stroke="#f2c14e" stroke-linecap="round">
      <circle cx="256" cy="256" r="170" stroke-width="5" opacity="0.18"/>
      <circle cx="256" cy="256" r="118" stroke-width="4" opacity="0.28"/>
      <g stroke-width="8" opacity="0.4">
        <line x1="256" y1="58" x2="256" y2="104"/>
        <line x1="256" y1="408" x2="256" y2="454"/>
        <line x1="58" y1="256" x2="104" y2="256"/>
        <line x1="408" y1="256" x2="454" y2="256"/>
      </g>
    </g>

    <!-- Cursor: wide gold glow, then gold outline, then white body -->
    <g transform="translate(176 118) scale(3.55)" stroke-linejoin="round">
      <path d="M0,0 L0,72 L17,56 L29,84 L41,79 L29,52 L52,52 Z"
            fill="none" stroke="#ff9d1a" stroke-width="9" opacity="0.9" filter="url(#softGlow)"/>
      <path d="M0,0 L0,72 L17,56 L29,84 L41,79 L29,52 L52,52 Z"
            fill="url(#cursorFill)" stroke="url(#gold)" stroke-width="5"/>
      <path d="M0,0 L0,72 L17,56 L29,84 L41,79 L29,52 L52,52 Z"
            fill="none" stroke="#3a2a08" stroke-width="1" opacity="0.6"/>
    </g>
  </g>

  <!-- Gold frame -->
  <rect x="20" y="20" width="472" height="472" rx="72" fill="none" stroke="url(#gold)" stroke-width="14"/>
  <rect x="32" y="32" width="448" height="448" rx="62" fill="none" stroke="#000" stroke-opacity="0.5" stroke-width="3"/>
</svg>
